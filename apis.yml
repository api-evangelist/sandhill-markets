name: Sandhill Markets
description: >-
  Sandhill Markets (formerly Stonks.com) was a private-markets investment
  platform founded in 2020 by serial entrepreneur Ali Moiz, backed by a16z. It
  let accredited investors buy and sell shares of leading pre-IPO companies
  through a secondary marketplace, Special Purpose Vehicles (SPVs), and a planned
  exchange, aiming to democratize an asset class historically gated by high
  minimums and opaque pricing. As of this enrichment pass the company exposes no
  public API, developer portal, or SDKs, and its primary web presence appears
  defunct/misconfigured: the apex domain sandhillmarkets.com returns a GitHub
  Pages "Site not found" 404, the former stonks.com domain now redirects to an
  unrelated product, and no api/docs/app subdomains resolve. Only a beehiiv-hosted
  newsletter subdomain (blog.sandhillmarkets.com) remains observable. This profile
  is retained as a company/portfolio-lead stub with no API surface to catalog.
